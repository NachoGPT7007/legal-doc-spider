; ============================================================================
;  legal-doc-spider  配置文件
; ----------------------------------------------------------------------------
;  这个文件是干什么的？
;    程序里所有「可以调的数字和开关」都集中放在这里。
;    你改完保存，下次运行就生效，完全不需要碰任何 .py 代码文件。
;
;  怎么改？
;    用记事本打开 → 改等号右边的值 → Ctrl+S 保存 → 关掉。
;    等号左边是「参数名」，不要改；以 ; 或 # 开头的整行是说明文字，不起作用。
;
;  注意：
;    值是中文的（是/否）不要漏字；填「是」才生效，填「否」就是关掉。
; ============================================================================


; ============================================================================
;  【第一区】抓取参数 —— 控制「去哪儿抓、抓多少、抓多快」
; ============================================================================
[抓取]

; 起始网址：你要抓的那个网页的地址（必须以 http:// 或 https:// 开头）
; 图形界面里填了以界面为准；这里留空即可
起始网址 =

; 最多抓多少个页面（包含你填的入口页本身）
; 作用：给「钻进同站链接」这件事踩刹车，防止不小心把人家整个网站抓下来
; 【想抓更多就把这个数字调大】例如想抓 300 篇就写 300
; 参考速度：每页约 1～3 秒，300 篇大约 10 分钟
最大页数 = 60

; ----------------------------------------------------------------------------
;  自动翻页 —— 解决「抓到的数据太少」的关键开关
; ----------------------------------------------------------------------------
; 为什么需要它：
;   很多网站的列表页只是「首屏」，完整列表藏在「更多」或「下一页」链接后面。
;   例如最高法官网的 /fabu.html 只有十几条，
;   完整列表其实在 /fabu/gengduo/xx.html 这些「更多」页里。
;   只读首屏 → 抓到的数据当然少。
;
; 开启后程序会做的事：
;   ① 遇到「更多 / 下一页 / more / list」这类链接 → 跟着翻
;   ② 把翻到的每一页里的详情页链接都收集起来（自动去重）
;   ③ 最后再逐篇抓正文 —— 也就是「先逛遍目录，再逐篇取书」
;
; 关掉它 → 只读入口页这一页（快，但数据少）
自动翻页 = 是

; 最多翻多少个列表页（防止无限翻下去）
; 20 个列表页 × 每页约 15 条 ≈ 最多能找到 300 个详情页链接
列表页上限 = 20

; 每抓完一页之后等待几秒，再抓下一页
; 作用：礼貌抓取。间隔太短会被网站当成攻击，轻则封 IP，重则拉黑
每页间隔秒 = 1.5

; 是否只跟随「和入口页同一个网站」的链接
; 是  = 只抓同一域名下的页面（推荐，数据更聚焦）
; 否  = 连跳到其它网站的链接也抓
只抓同一网站 = 是

; 单个网页最多等多少秒。超过这个时间就判定为「打不开」
超时秒数 = 20

; 下载失败时重试几次（网络抖动很常见，重试往往就成功了）
重试次数 = 3

; 是否走代理。有些网站直连握不上手（报 SSL 错误），走代理就通了
; 你本机的 Clash 代理地址一般是 127.0.0.1:7890
使用代理 = 否
代理地址 = http://127.0.0.1:7890

; 是否检查网站的 robots.txt（网站写给爬虫看的「哪些能抓」的约定）
; 是  = 更规矩，但有些网站会因为 robots.txt 而拒绝，能抓的页面变少
; 否  = 直接抓（个人查阅公开法律文书通常没问题）
遵守robots协议 = 否

; ----------------------------------------------------------------------------
;  钻取链接关键词 —— 这是最实用的一个筛子，建议你重点用起来
; ----------------------------------------------------------------------------
; 作用：从入口页「钻一层」时，只看链接文字里含不含这些词，含才跟进抓取。
; 好处：列表页上通常混着开庭公告、招聘、采购、通知等无关链接，
;       填上关键词就能只把你要的那类文书抓回来。
;
; 举例（抓司法解释、法律条文）：
;     解释,规定,批复,决定,意见,办法,通知
; 举例（抓判决书、裁定书）：
;     判决书,裁定书,调解书,决定书
; 举例（抓指导性案例）：
;     指导性案例,案例
;
; 多个词用英文逗号分隔。留空 = 不按链接文字筛选（抓到什么算什么）
钻取链接必须包含 =

; 排除：链接文字含这些词就跳过。例如：
;     招聘,采购,公告,公示,招标,中标,开标,人事,任免
钻取链接排除 =


; ============================================================================
;  【1.5 区】关键词检索 —— 让程序先去网站搜，再抓搜到的每一条
; ----------------------------------------------------------------------------
;  为什么需要这一区？
;    「给一个列表页 → 跟进它的链接」这种用法，只能抓到列表页上排在前面的内容。
;    如果你想「按关键词搜，把搜到的都抓回来」，或者想「按标题/文号这些字段搜」，
;    就启用这一区。
;
;  原理（这是最靠谱的路子）：
;    用网站自己的检索功能 —— 把关键词填进它的检索网址里，检索由网站自己完成。
;    这比你猜它的筛选规则可靠得多，因为筛选逻辑本来就是它自己实现的。
;
;  怎么用：
;    1. 把「启用检索模式」改成「是」
;    2. 从下面的预置模板里复制一整行到「检索网址模板」
;    3. 打开图形界面，程序会自动为模板里的每个 {占位符} 生成一个输入框
;    4. 填好检索词 → 点开始抓取
; ============================================================================
[关键词检索]

; 是否启用检索模式
; 否 = 老用法：直接抓你填的那个网址（列表页），再跟进它的链接
; 是 = 新用法：先拿关键词去网站检索，再抓检索到的每一条
启用检索模式 = 否

; 检索网址模板。{花括号里的名字} 就是占位符，程序会替换成你填的检索词。
; 中文会自动做网址编码（变成 %E5%BB%BA%E8%AE%BE...），你不用管。
;
; 【预置模板 —— 复制其中一整行，粘贴到下面「检索网址模板 =」的后面】
;
; ① 最高人民法院官网（一个检索框，搜全文）
;    http://www.court.gov.cn/search.html?content={关键词}
;    实测：搜「建设工程施工合同」返回 13 条结果
;
; ② 最高人民法院公报（高级检索，三个字段可以分开用）
;    http://gongbao.court.gov.cn/QueryArticle.html?title={标题}&content={全文}&document_number={文号}
;    实测：三个字段都能检索，检索结果静态渲染在页面里，可以抓
;    用法举例（把不用的字段留空即可）：
;       只按标题搜      → title={关键词}&content=&document_number=
;       只按文号搜      → title=&content=&document_number={关键词}
;       标题+全文一起限 → title={标题}&content={全文}&document_number=
;
; ③ 你自己的模板：在浏览器里做一次检索，把地址栏那一串复制过来，
;    再把检索词的位置改成 {关键词}
检索网址模板 =


; ============================================================================
;  【第二区】正文抽取 —— 决定「从网页里抠出哪一段才算是正文」
; ============================================================================
[正文抽取]

; 正文选择器：留空 = 全自动智能识别（先用这个，绝大多数站够用）
; 如果某个站的正文总是抽不准，就把该站正文的 CSS 选择器填在这里
; 怎么知道填什么？在浏览器里按 F12 → 点左上角箭头 → 点正文 → 看高亮的标签
; 写法举例（只支持单个选择器，不支持 "div > p" 这种层级写法）：
;   div.txt_txt      表示 找 class="txt_txt" 的 div
;   #zoom            表示 找 id="zoom" 的元素
;   div.article-content
正文选择器 =

; 标题选择器：一般留空。留空时程序自动按 <h1> → 网页标题 的顺序去找
标题选择器 =

; 正文最短字数：抽出来的正文如果短于这个字数，就判定为「抽取失败」
; 作用：宁可告诉你「这次没抽到」，也不要塞给你一堆导航文字
; 如果你常抓短新闻（几百字），可以调到 50
正文最短字数 = 100


; ============================================================================
;  【第三区】清洗与筛选 —— 决定「抓回来的东西怎么变干净、留哪些」
; ============================================================================
[清洗筛选]

; 必须包含关键词（多个用英文逗号分隔，例如：判决书,裁定书,解释）
; 非空时：只有正文或标题里含有其中任意一个词的页面才会被保留
; 留空 = 不做这一步筛选
必须包含关键词 =

; 排除关键词（多个用英文逗号分隔，例如：招聘,采购,广告,培训）
; 正文或标题含有这些词的页面会被丢掉
排除关键词 =

; 是否丢掉完全重复的段落
; 是 = 同一篇正文里重复出现的行只保留一次（能干掉不少导航残留）
段落去重 = 是

; 是否删掉含有网址（http 开头）的段落
; 有些网页会把「原文链接」混进正文，打开这个可以清掉
删除含网址的段落 = 否

; 额外杂质词：程序内置了一批常见杂质（责任编辑、版权所有、ICP备、上一篇……）
; 如果你还遇到别的杂质行，在这里补充，英文逗号分隔
额外杂质词 =


; ============================================================================
;  【第四区】输出 —— 结果存成什么样
; ============================================================================
[输出]

; 结果文件夹名（相对于本项目目录）。每次运行会自动在里面建一个带时间和网址的
; 子文件夹，不会覆盖你上一次的结果
输出目录 = output

; 是否额外生成 results.json（结构化数据，方便以后用程序再加工）
生成JSON = 是

; 是否额外生成「汇编.md」：把所有正文拼成一个大文件，方便直接阅读和分享
生成汇编 = 是
